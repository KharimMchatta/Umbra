# Paste this block into the site root .htaccess, above the section WordPress writes itself.
# Never add WordPress's own start or end marker text anywhere in this block, not even in a
# comment: WordPress looks for its markers inside any line and would replace this whole block
# the next time permalinks are saved.
# It pairs with the Umbra plugin: the plugin hides WordPress in PHP, this hides it at the web-server layer.
# Requires Apache with mod_headers (for the security headers) and mod_rewrite (already on for WordPress permalinks).
# Scoped deliberately: it does NOT blanket-block .html/.xml/.txt, so sitemap.xml, robots.txt and ads.txt keep working.

# Disable directory listing so a folder with no index file does not expose its contents.
# Risk note: none for a normal site; only hides an auto-generated listing.
Options -Indexes

# Block the specific files that leak the WordPress, plugin or theme version, or are install/config artefacts.
# readme.html and license.txt carry the core version; readme.txt/readme.md/changelog.txt/changelog.md/changes.txt
# carry plugin and theme names and versions (e.g. wp-content/plugins/*/readme.txt); wp-config and install files
# must never be web-readable.
# FilesMatch matches the file basename site-wide, so these names are denied in any directory.
# Risk note: blocks all files with these basenames anywhere, which is the intent. It does not touch
# sitemap.xml, robots.txt or ads.txt, and does not blanket-block other .html/.txt/.md files.
<FilesMatch "^(readme\.html|readme\.txt|readme\.md|license\.txt|changelog\.txt|changelog\.md|changes\.txt|wp-config\.php|wp-config-sample\.php|install\.php)$">
    Require all denied
</FilesMatch>

# Block backup, copy and editor-swap files of wp-config.php (wp-config.php.bak, .old, .save, .orig, .txt,
# wp-config.php~, .wp-config.php.swp, #wp-config.php#, backup-wp-config.php and similar). A copy is not run as
# PHP, so the web server would hand out the database password and keys as plain text.
# The match is case-insensitive and on any file name containing "wp-config", in any directory; it is denied the
# same way whether or not the file exists, so a probe cannot tell which copies are present.
# Risk note: none for a normal site; WordPress never serves a file named like this to visitors.
<FilesMatch "(?i)wp-config">
    Require all denied
</FilesMatch>

# Block the WordPress debug log (wp-content/debug.log, written when WP_DEBUG_LOG is on). It exposes server
# paths, plugin and theme names and error details. Matches debug.log and rotated copies (debug.log.1) anywhere.
# Risk note: none for visitors; read the log over SFTP or the hosting file manager instead.
<FilesMatch "(?i)^debug\.log">
    Require all denied
</FilesMatch>

# Protect .htaccess itself from being read over the web (most servers already do this).
# Risk note: none.
<FilesMatch "^\.ht">
    Require all denied
</FilesMatch>

# Deny direct access to xmlrpc.php (brute-force amplification and pingback-DDoS vector).
# Risk note: this breaks Jetpack and the official WordPress mobile app, which call xmlrpc.php.
#            Remove this block if you use either. Keep it in sync with UMBRA_DISABLE_XMLRPC in umbra.php.
<FilesMatch "^xmlrpc\.php$">
    Require all denied
</FilesMatch>

# Custom login URL companion: 404 the registration/activation endpoints so they
# cannot 302-redirect to (and thereby disclose) the hidden login slug, and the
# legacy wp-register.php, which otherwise 301s to the registration page.
# The plugin already 404s wp-signup.php and wp-register.php in PHP when the custom login is on;
# wp-activate.php defines WP_INSTALLING, so WordPress loads NO plugins on that
# request (wp_get_active_and_valid_plugins returns nothing while installing) and
# the plugin cannot gate it in PHP. This server-layer rule closes wp-activate.php
# (and wp-signup.php, belt-and-braces) with a genuine 404, including the
# path-info form (/wp-activate.php/x), which Apache also runs as wp-activate.php.
# Risk note: only relevant with the custom login URL on; on a site that uses
#            self-registration or multisite signup, remove this block.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^wp-(signup|activate|register)\.php(/|$) - [R=404,L]
</IfModule>

# Current, non-deprecated security response headers.
# Risk note: X-Frame-Options SAMEORIGIN blocks the site being framed by other origins; if you intentionally
#            embed this site elsewhere, relax it. X-XSS-Protection is deliberately omitted (deprecated, can introduce bugs).
<IfModule mod_headers.c>
    Header set X-Content-Type-Options "nosniff"
    Header set X-Frame-Options "SAMEORIGIN"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# OPTIONAL, OFF BY DEFAULT: block direct access to PHP files under wp-includes.
# Caution: this hardens internals but breaks some plugins that load wp-includes PHP directly
#          (and must NOT block wp-includes/ms-files.php on multisite). Uncomment only after testing.
